# OTK zk-Metering — API Server (local dev / smoke)
#
# Usage (RV-RUNS-11, RUN-S: NODE_ENV=production refuses to start without authentication, so the credentials are
# mandatory; generate them, never reuse example values):
#   OTK_TENANTS=<tenant>/OWNER:<token> OTK_ADMIN_KEY=<key> OTK_CSRF_SECRET=<secret> \
#     docker compose -f docker/api/docker-compose.api.yml up --build
#
# Health check:
#   curl http://localhost:8787/health

services:
  api:
    build:
      context: ../..                  # repo root
      dockerfile: docker/api/Dockerfile
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - API_PORT=8787
      - OTK_TENANTS=${OTK_TENANTS:?OTK_TENANTS is required (production refuses to start without authentication)}
      - OTK_ADMIN_KEY=${OTK_ADMIN_KEY:?OTK_ADMIN_KEY is required}
      - OTK_CSRF_SECRET=${OTK_CSRF_SECRET:?OTK_CSRF_SECRET is required}
      # H1-S01: this local smoke setup has no PostgreSQL; the opt-out is explicit and logged (set OTK_DB_URL instead)
      - OTK_ALLOW_NON_DURABLE_STORES=${OTK_ALLOW_NON_DURABLE_STORES:-1}
    healthcheck:
      test: ["CMD", "node", "-e",
        "const h=require('http'); h.get('http://localhost:8787/health', r => { process.exit(r.statusCode===200?0:1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
