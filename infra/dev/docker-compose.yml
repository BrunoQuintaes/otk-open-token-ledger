name: otk-devnet

services:
  besu-dev:
    image: hyperledger/besu:25.12.0
    container_name: otk-besu-dev
    restart: unless-stopped
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    command:
      - --genesis-file=/config/genesis.json
      - --network-id=2018
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,TXPOOL
      - --rpc-http-cors-origins=all
      - --host-allowlist=*
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,TXPOOL
      - --data-path=/var/lib/besu
    volumes:
      - besu_dev_data:/var/lib/besu
      - "./config/genesis.json:/config/genesis.json:ro"

volumes:
  besu_dev_data:
