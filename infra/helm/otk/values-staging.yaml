# OTK Helm — staging overrides
# Usage: helm install otk ./infra/helm/otk -f infra/helm/otk/values-staging.yaml

replicaCount: 2

config:
  NODE_ENV: "staging"

secrets:
  existingSecret: "otk-staging-secrets"

pdb:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/limit-rpm: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  hosts:
    - host: api-staging.otk.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: otk-staging-tls
      hosts:
        - api-staging.otk.io
