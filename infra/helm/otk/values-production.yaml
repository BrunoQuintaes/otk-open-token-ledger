# OTK Helm — production overrides
# Usage: helm install otk ./infra/helm/otk -f infra/helm/otk/values-production.yaml

replicaCount: 3

config:
  NODE_ENV: "production"
  OTK_STRICT_VERSIONING: "1"

secrets:
  existingSecret: "otk-production-secrets"

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

pdb:
  enabled: true
  minAvailable: 2

serviceAccount:
  create: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  customMetrics:
    - type: Pods
      pods:
        metric:
          name: otk_proof_queue_depth
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/limit-rpm: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.otk.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: otk-production-tls
      hosts:
        - api.otk.io
