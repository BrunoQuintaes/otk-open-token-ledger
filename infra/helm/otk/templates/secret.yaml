{{- /*
  PF-NEW-03 (RUN-S 2026-10-09, decision D2): a production or staging release must not render empty credentials,
  otherwise the API runs with authentication disabled or without a platform credential. With existingSecret the
  values are not visible here; the server refuses to start without OTK_TENANTS and OTK_ADMIN_KEY (productionGuard).
*/ -}}
{{- $nodeEnv := toString (default "" .Values.config.NODE_ENV) }}
{{- if and (not .Values.secrets.existingSecret) (or (eq $nodeEnv "production") (eq $nodeEnv "staging")) }}
{{- /* H1-S01 (OTK-H1-MEGA 2026-10-13): OTK_DB_URL too; the server refuses in-memory plan assignments when deployed */ -}}
{{- range $k := list "OTK_TENANTS" "OTK_ADMIN_KEY" "OTK_JWT_SECRET" "OTK_CSRF_SECRET" "OTK_DB_URL" }}
{{- if not (trim (toString (default "" (index $.Values.secrets.data $k)))) }}
{{- fail (printf "secrets.data.%s is required when config.NODE_ENV=%s (PF-NEW-03); set it or use secrets.existingSecret" $k $nodeEnv) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otk.secretName" . }}
  labels:
    {{- include "otk.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
