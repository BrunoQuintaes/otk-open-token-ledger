# OTK zk-Metering — Nginx Load Balancer (Wave 3A reference config)
# NEW-3.01: Session Affinity Config
# Stateless REST: least_conn | SSE/WS: ip_hash

upstream otk_api {
    least_conn;
    server api-1:8787;
    server api-2:8787;
}

upstream otk_api_sticky {
    ip_hash;
    server api-1:8787;
    server api-2:8787;
}

# SEC-08: TLS server block — set SSL_CERT_PATH / SSL_KEY_PATH env vars at deploy time
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_KEY_PATH};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Health probes (no sticky needed)
    location /healthz { proxy_pass http://otk_api; }
    location /readyz  { proxy_pass http://otk_api; }

    # SSE/WebSocket paths (sticky sessions)
    location /app/events {
        proxy_pass http://otk_api_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # All other routes (stateless)
    location / {
        proxy_pass http://otk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_next_upstream error timeout http_503;
    }
}

# HTTP (port 80) — health probes allowed, redirect everything else to HTTPS
server {
    listen 80;
    server_name _;

    location /healthz { proxy_pass http://otk_api; }
    location /readyz  { proxy_pass http://otk_api; }

    location / {
        return 301 https://$host$request_uri;
    }
}
