# Checks that changed TypeScript/JavaScript files keep their documentation comments (TSDoc/JSDoc):
# a file header with @module and a doc comment on every exported function, class, type and constant.
#
# It runs on every pull request and on pushes to main, and only looks at the files that changed, so it never
# blocks on older code. The lint packages are installed for the run only (--no-save): package.json and
# package-lock.json stay exactly as in the evaluated version.
# Rules: eslint.docs.config.mjs (documentation only, no style rules). How to run the same check locally:
# docs/DOCUMENTACAO_DO_CODIGO.md.
name: documentacao

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  comentarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, to compare with the base of the pull request or the previous push.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the project and, for this run only, the documentation lint
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund eslint@10.15.0 typescript-eslint@8.74.0 eslint-plugin-jsdoc@65.5.5
      - name: Check the documentation comments of the changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          # First push of a branch has no previous commit: nothing to compare, nothing to check.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "No previous commit to compare."; exit 0; fi
          # Byte-hashed evidence (the panel package) is never linted: it must stay as recorded.
          git diff --name-only --diff-filter=ACMR "$BASE" "${{ github.sha }}" -- '*.ts' '*.mts' '*.cts' '*.js' '*.mjs' '*.cjs' \
            | grep -v '^reproducao/otk-banca-pack-' | grep -v '^web/' > changed.txt || true
          if [ ! -s changed.txt ]; then echo "No TypeScript/JavaScript file changed."; exit 0; fi
          xargs -a changed.txt node node_modules/eslint/bin/eslint.js --config eslint.docs.config.mjs --no-warn-ignored
