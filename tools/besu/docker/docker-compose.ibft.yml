networks:
  besu-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

services:
  node1:
    image: hyperledger/besu:latest
    container_name: otk-besu-node1
    networks:
      besu-net:
        ipv4_address: 172.25.0.11
    volumes:
      - ./network/node1:/var/lib/besu
    command: >
      --data-path=/var/lib/besu/data
      --genesis-file=/var/lib/besu/genesis.json
      --network-id=1337
      --p2p-host=172.25.0.11
      --p2p-port=30303
      --host-allowlist=*
      --rpc-http-enabled=true
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,IBFT,TXPOOL,ADMIN
      --rpc-ws-enabled=true
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --min-gas-price=0
      --sync-mode=FULL
      --logging=INFO
    ports:
      - "8545:8545"
      - "8546:8546"

  node2:
    image: hyperledger/besu:latest
    container_name: otk-besu-node2
    networks:
      besu-net:
        ipv4_address: 172.25.0.12
    volumes:
      - ./network/node2:/var/lib/besu
    command: >
      --data-path=/var/lib/besu/data
      --genesis-file=/var/lib/besu/genesis.json
      --network-id=1337
      --bootnodes=enode://${NODE1_ENODE}@172.25.0.11:30303
      --p2p-port=30303
      --host-allowlist=*
      --rpc-http-enabled=false
      --rpc-ws-enabled=false
      --min-gas-price=0
      --sync-mode=FULL
      --logging=INFO
    depends_on:
      - node1

  node3:
    image: hyperledger/besu:latest
    container_name: otk-besu-node3
    networks:
      besu-net:
        ipv4_address: 172.25.0.13
    volumes:
      - ./network/node3:/var/lib/besu
    command: >
      --data-path=/var/lib/besu/data
      --genesis-file=/var/lib/besu/genesis.json
      --network-id=1337
      --bootnodes=enode://${NODE1_ENODE}@172.25.0.11:30303
      --p2p-port=30303
      --host-allowlist=*
      --rpc-http-enabled=false
      --rpc-ws-enabled=false
      --min-gas-price=0
      --sync-mode=FULL
      --logging=INFO
    depends_on:
      - node1

  node4:
    image: hyperledger/besu:latest
    container_name: otk-besu-node4
    networks:
      besu-net:
        ipv4_address: 172.25.0.14
    volumes:
      - ./network/node4:/var/lib/besu
    command: >
      --data-path=/var/lib/besu/data
      --genesis-file=/var/lib/besu/genesis.json
      --network-id=1337
      --bootnodes=enode://${NODE1_ENODE}@172.25.0.11:30303
      --p2p-port=30303
      --host-allowlist=*
      --rpc-http-enabled=false
      --rpc-ws-enabled=false
      --min-gas-price=0
      --sync-mode=FULL
      --logging=INFO
    depends_on:
      - node1
