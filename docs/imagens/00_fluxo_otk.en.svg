<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How OTK works</title>
  <desc id="d">The program sends the request to OTK; OTK counts the tokens before forwarding the request to the provider; the provider answers and reports its usage; OTK records the count and the reported usage and signs a receipt; the verifier checks the receipt offline, with the public keyring and its fingerprint.</desc>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <rect x="20" y="70" width="170" height="90" rx="10" fill="#f2f2f2" stroke="#666"/>
  <text x="105" y="110" text-anchor="middle" font-size="17" font-weight="600" fill="#222">Your program</text>
  <text x="105" y="134" text-anchor="middle" font-size="13" fill="#444">(that calls the AI)</text>

  <rect x="300" y="40" width="330" height="160" rx="10" fill="#e8f0fb" stroke="#2f62a8" stroke-width="1.5"/>
  <text x="465" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#1d3f70">OTK (proxy)</text>
  <text x="318" y="98" font-size="13.5" fill="#222">1. counts the request's tokens BEFORE</text>
  <text x="333" y="116" font-size="13.5" fill="#222">sending it (in memory)</text>
  <text x="318" y="144" font-size="13.5" fill="#222">2. records the count and the reported usage,</text>
  <text x="333" y="162" font-size="13.5" fill="#222">compares the counts and computes the cost*</text>
  <text x="318" y="188" font-size="13.5" fill="#222">3. signs a receipt for the call</text>

  <rect x="760" y="70" width="180" height="90" rx="10" fill="#f2f2f2" stroke="#666"/>
  <text x="850" y="110" text-anchor="middle" font-size="17" font-weight="600" fill="#222">AI provider</text>
  <text x="850" y="134" text-anchor="middle" font-size="13" fill="#444">OpenAI, Anthropic, Google</text>

  <rect x="300" y="300" width="330" height="80" rx="10" fill="#fff7e0" stroke="#a0781a"/>
  <text x="465" y="332" text-anchor="middle" font-size="17" font-weight="600" fill="#5a420a">Signed receipt</text>
  <text x="465" y="356" text-anchor="middle" font-size="13" fill="#444">one per call</text>

  <rect x="20" y="300" width="200" height="130" rx="10" fill="#eaf6ec" stroke="#2e7d3a"/>
  <text x="120" y="330" text-anchor="middle" font-size="17" font-weight="600" fill="#1f5a28">Verifier</text>
  <text x="120" y="352" text-anchor="middle" font-size="13" fill="#333">web page or command,</text>
  <text x="120" y="370" text-anchor="middle" font-size="13" fill="#333">no internet needed</text>
  <text x="120" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#333">OK · Atenção · Falhou</text>

  <rect x="720" y="300" width="220" height="80" rx="10" fill="#f2f2f2" stroke="#666" stroke-dasharray="5 4"/>
  <text x="830" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Public keyring</text>
  <text x="830" y="354" text-anchor="middle" font-size="13" fill="#444">+ fingerprint (sha256)</text>

  <line x1="190" y1="100" x2="298" y2="100" stroke="#444" stroke-width="2" marker-end="url(#s)"/>
  <text x="244" y="92" text-anchor="middle" font-size="12.5" fill="#333">request</text>
  <line x1="298" y1="135" x2="192" y2="135" stroke="#444" stroke-width="2" marker-end="url(#s)"/>
  <text x="244" y="152" text-anchor="middle" font-size="12.5" fill="#333">answer</text>

  <line x1="630" y1="100" x2="758" y2="100" stroke="#444" stroke-width="2" marker-end="url(#s)"/>
  <text x="694" y="92" text-anchor="middle" font-size="12.5" fill="#333">request</text>
  <line x1="758" y1="135" x2="632" y2="135" stroke="#444" stroke-width="2" marker-end="url(#s)"/>
  <text x="694" y="152" text-anchor="middle" font-size="12.5" fill="#333">answer + usage</text>

  <line x1="465" y1="200" x2="465" y2="298" stroke="#444" stroke-width="2" marker-end="url(#s)"/>
  <line x1="300" y1="340" x2="222" y2="340" stroke="#444" stroke-width="2" marker-end="url(#s)"/>
  <path d="M720,360 C600,430 320,430 222,400" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#s)"/>

  <text x="20" y="448" font-size="12" fill="#555">* compare and compute the cost: only for the models listed in section 12.</text>
  <text x="20" y="464" font-size="12" fill="#555">The receipt proves the numbers did not change after signing; it does not prove the provider counted right.</text>
</svg>
